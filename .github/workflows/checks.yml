name: Offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      BH_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies without the Apple-only model runtime
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as f:
              config = tomllib.load(f)
          deps = [d for d in config['project']['dependencies'] if not d.startswith('laya-mlx')]
          deps += config['dependency-groups']['dev'] + ['build']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *deps], check=True)
          PY
      - name: Offline tests and lint
        run: |
          python -m pytest -q
          python -m ruff check .
          node --check laya_ultrafast/snapshot.js
          node --check laya_ultrafast/static/app.js
      - name: Build and check packaged browser assets
        run: |
          python -m build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel, = Path('dist').glob('*.whl')
          with ZipFile(wheel) as package:
              expected = {'laya_ultrafast/snapshot.js', 'laya_ultrafast/static/index.html',
                          'laya_ultrafast/static/app.js', 'laya_ultrafast/static/fixture.html'}
              assert expected <= set(package.namelist()), 'Browser assets missing from wheel'
          PY
